# OxiDNS default configuration for OpenWrt and iStoreOS.
#
# The package postinst script replaces the placeholder password with a
# generated random value and stores the same value in:
# /etc/oxidns/initial_password

log:
  level: info

api:
  http:
    listen: "0.0.0.0:9199"
    auth:
      type: basic
      username: admin
      password: "__OXIDNS_GENERATE_ON_INSTALL__"
    webui:
      root: "/usr/share/oxidns/webui"

plugins:
  - tag: forward
    type: forward
    args:
      upstreams:
        - addr: "223.5.5.5"

  - tag: main_sequence
    type: sequence
    args:
      - exec: $forward
      - exec: accept

  - tag: udp_server
    type: udp_server
    args:
      entry: main_sequence
      listen: ":5335"

  - tag: tcp_server
    type: tcp_server
    args:
      entry: main_sequence
      listen: ":5335"
